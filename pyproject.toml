[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orcaobra-ai"
version = "2.1.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM"]
ignore = ["BLE001", "S110", "DTZ005", "DTZ011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"


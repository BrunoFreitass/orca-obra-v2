name: CI — Testes & Lint

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'requirements-api.txt') }}

      - name: Install system deps (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-api.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check . --exclude .venv,venv,__pycache__,.cache_ia

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          MOCK_AI: "true"
          USE_CACHE: "false"
          AUTH_DISABLED: "true"

      - name: Upload coverage (optional)
        if: matrix.python-version == '3.12'
        run: pytest tests/ --cov=core --cov-report=xml --cov-report=term
        env:
          MOCK_AI: "true"
          USE_CACHE: "false"
          AUTH_DISABLED: "true"
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

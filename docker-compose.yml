services:
  app:
    build: .
    container_name: orcaobra-ai
    ports:
      - "8501:8501"
    volumes:
      # Dados persistentes fora do container
      # NOTA: arquivos soltos (historico.db, precos_customizados.json)
      # NAO devem ser montados individualmente — se nao existirem no host,
      # o Docker cria PASTAS com esses nomes e o SQLite quebra.
      # Use um diretório data/ no host se precisar persistir esses arquivos.
      - ./orcamentos_salvos:/app/orcamentos_salvos
      - ./perfil_empresa:/app/perfil_empresa
      - ./.cache_ia:/app/.cache_ia
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - MOCK_AI=${MOCK_AI:-false}
      - USE_CACHE=${USE_CACHE:-true}
    restart: unless-stopped
